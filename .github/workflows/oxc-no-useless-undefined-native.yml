name: Fork-only no-useless-undefined formatting

on:
  push:
    branches: [ci/no-useless-undefined-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-no-useless-undefined-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rustfmt:
    if: >-
      ${{ github.repository == 'BleedingDev/oxc'
      && github.event.repository.fork == true
      && github.ref == 'refs/heads/ci/no-useless-undefined-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: rustfmt
          tools: just
          restore-cache: false
          save-cache: false
      - name: Verify native formatting correction
        run: |
          rustc --version
          rustfmt --version
          rustfmt --edition 2024 --check \
            crates/oxc_linter/src/rules/unicorn/no_useless_undefined.rs
